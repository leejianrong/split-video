name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: openapi.json is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

      - name: edit plan schema is up to date
        run: uv run python scripts/export_edit_plan_schema.py --check

      - name: edit ops schema is up to date
        run: uv run python scripts/export_edit_ops_schema.py --check

      - name: error catalogue is up to date
        run: uv run python scripts/export_error_catalogue.py --check

  # Svelte frontend (docs/adr/0004-frontend-stack-and-structure.md). Adding this job as a required check is a
  # repository setting.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint and prettier)
        run: npm run lint

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test

      # The typed API client is generated from the committed openapi.json (no Python needed). Fix a failure
      # with `make api-client` and commit the result.
      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code -- src/lib/api/generated
          test -z "$(git status --porcelain -- src/lib/api/generated)" || { git status --porcelain -- src/lib/api/generated; exit 1; }

      - name: Build
        run: npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1

      # The package must carry the build, or pip users get a 404 at /app/ (they have no Node).
      - name: Wheel and sdist contain the build
        working-directory: .
        run: |
          uv build --out-dir dist
          python3 scripts/check_wheel_contents.py dist

  test:
    runs-on: ubuntu-latest
    # The identical suite took 8, 12 and 24.6 minutes on GitHub-hosted runners, and one run was cancelled at the old
    # 25 minute limit: runner speed varies about 3x. The real-model tests are opt-in and skipped. Real hangs are caught
    # per test (pytest-timeout 300 s, the SPL-110 ffmpeg watchdog), so this job limit is only the backstop; without it
    # a wedged ffmpeg held the job for GitHub's 6 h default (SPL-110).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  build-and-push:
    needs: [test, lint]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a push to main: `latest` + `sha-<short>`, same as before. On a
      # `vX.Y.Z` tag push: also `X.Y.Z` and `X.Y` (type=semver no-ops on a
      # branch push, so these two lines are inert outside a tag build) --
      # see CONTRIBUTING.md (Releasing) for the release steps.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
