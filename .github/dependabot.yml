version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the digest-pinned python base image in the Dockerfile current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Svelte frontend (docs/adr/0004-frontend-stack-and-structure.md). Dev tooling minor and patch bumps arrive
  # as one PR; svelte, vite and typescript majors stay separate PRs.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
