[project]
name = "split-video"
version = "0.1.0"
description = "Split a long recording of back-to-back songs into individual files by detecting silence gaps"
readme = "README.md"
authors = [
    { name = "leejianrong", email = "leejianrong2@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ai-edge-litert>=1.2.0",
    "fastapi>=0.141.1",
    "numpy>=1.26",
    "typer>=0.12",
    "uvicorn>=0.52.4",
]

[project.scripts]
split-video = "split_video.cli:app"

[build-system]
requires = ["uv_build>=0.9.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.flake8-bugbear]
# typer's Argument()/Option() calls in parameter defaults are the documented
# idiom for declaring CLI params, not the mutable-default footgun B008 flags.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
